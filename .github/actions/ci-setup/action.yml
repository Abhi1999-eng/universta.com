name: CI setup
description: >-
  Node, dependencies, the two Linux-only CSS binaries, a CI MySQL and a
  migrated, seeded database. Everything every CI job needs before it can run
  anything, in one place so the jobs cannot drift apart.

inputs:
  database:
    description: >-
      Set to "false" for a job that needs no database, which skips MySQL,
      the migrations and both seeds.
    required: false
    default: 'true'
  ci-db-password:
    description: The CI-only database password.
    required: false
    default: ''
  playwright:
    description: >-
      Set to "true" to install the Chromium build the browser suite drives,
      from cache when the pinned Playwright version has not moved.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js 25
      uses: actions/setup-node@v6
      with:
        node-version: 25
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Linux CSS build binary
      shell: bash
      run: |
        lightning_dir="${RUNNER_TEMP}/lightningcss-linux-x64-gnu"
        mkdir -p "$lightning_dir/extracted" node_modules/lightningcss-linux-x64-gnu
        npm pack --silent --pack-destination "$lightning_dir" lightningcss-linux-x64-gnu@1.32.0
        tar -xzf "$lightning_dir/lightningcss-linux-x64-gnu-1.32.0.tgz" -C "$lightning_dir/extracted"
        cp -R "$lightning_dir/extracted/package/." node_modules/lightningcss-linux-x64-gnu/

        oxide_dir="${RUNNER_TEMP}/tailwindcss-oxide-linux-x64-gnu"
        mkdir -p "$oxide_dir/extracted" apps/web/node_modules/@tailwindcss/oxide-linux-x64-gnu apps/admin/node_modules/@tailwindcss/oxide-linux-x64-gnu
        npm pack --silent --pack-destination "$oxide_dir" @tailwindcss/oxide-linux-x64-gnu@4.3.3
        tar -xzf "$oxide_dir/tailwindcss-oxide-linux-x64-gnu-4.3.3.tgz" -C "$oxide_dir/extracted"
        cp -R "$oxide_dir/extracted/package/." apps/web/node_modules/@tailwindcss/oxide-linux-x64-gnu/
        cp -R "$oxide_dir/extracted/package/." apps/admin/node_modules/@tailwindcss/oxide-linux-x64-gnu/

    - name: Start native MySQL
      if: inputs.database == 'true'
      shell: bash
      run: sudo systemctl start mysql

    - name: Create CI-only databases and user
      if: inputs.database == 'true'
      shell: bash
      env:
        CI_DB_PASSWORD: ${{ inputs.ci-db-password }}
      run: |
        # Ubuntu's preinstalled runner MySQL root password is the documented CI-only value: root.
        sudo mysql --protocol=socket -uroot -proot -e "CREATE DATABASE IF NOT EXISTS universta_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS universta_ci_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'universta_ci_user'@'127.0.0.1' IDENTIFIED BY '${CI_DB_PASSWORD}'; GRANT ALL PRIVILEGES ON universta_ci.* TO 'universta_ci_user'@'127.0.0.1'; GRANT ALL PRIVILEGES ON universta_ci_shadow.* TO 'universta_ci_user'@'127.0.0.1'; FLUSH PRIVILEGES;"

    - name: Prisma generate
      shell: bash
      run: npm run db:generate

    - name: Prisma migrate deploy
      if: inputs.database == 'true'
      shell: bash
      run: npm run db:migrate:deploy

    - name: Foundation seed
      if: inputs.database == 'true'
      shell: bash
      run: npm run db:seed

    - name: Demo catalog seed
      if: inputs.database == 'true'
      shell: bash
      run: npm --workspace apps/api run db:seed:demo

    # Chromium is the same ~46s download on every job of every run, and it
    # only changes when Playwright does. Keyed on the installed version, so
    # a bump misses the cache once and then stops costing anything again.
    - name: Resolve the pinned Playwright version
      if: inputs.playwright == 'true'
      id: playwright-version
      shell: bash
      run: |
        version="$(npm --workspace apps/admin exec -- playwright --version | tr -dc '0-9.')"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Restore the Playwright browser cache
      if: inputs.playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # The browser itself comes from the cache; its system libraries are the
    # runner's and are not cached, so they are installed either way.
    - name: Install Playwright Chromium
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm --workspace apps/admin exec -- playwright install --with-deps chromium

    - name: Install only Chromium's system libraries
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npm --workspace apps/admin exec -- playwright install-deps chromium
