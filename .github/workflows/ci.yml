name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
          - status
          - qa-seed
          - qa-report
          - qa-cleanup
      sha:
        description: Exact 40-character commit SHA (required for deploy, optional for rollback)
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'universta-demo-deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}

jobs:
  checks:
    # Everything that needs no database: the schema checks, the linter, the
    # unit suites that run in memory, the build, and the release this run
    # would deploy. None of it waits for MySQL to come up and be seeded, so a
    # formatting slip is known in a couple of minutes rather than six.
    name: CI / Checks and build
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci
      SHADOW_DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci_shadow
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SWAGGER_ENABLED: false
      JWT_ACCESS_SECRET: ci-only-access-secret-2026-long-enough-for-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-2026-different-and-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      AUTH_REFRESH_COOKIE_NAME: universta_admin_refresh
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 15
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-only-seed-password-2026-strong
      SEED_DEMO_CATALOG: "true"
      SUPER_ADMIN_FIRST_NAME: CI
      SUPER_ADMIN_LAST_NAME: Admin
      CI_DB_PASSWORD: ci-only-db-password-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node and dependencies
        uses: ./.github/actions/ci-setup
        with:
          database: 'false'

      - name: Prisma format check
        run: npm run db:format -- --check

      - name: Prisma validate
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Admin unit and catalog tests
        run: npm --workspace apps/admin run test -- --run

      - name: Web unit tests
        run: npm --workspace apps/web run test -- --run

      - name: Build web, admin, and API
        run: npm run build

      - name: Confirm the Admin auth BFF routes are in the build
        # The Admin console reaches the API only through these four route
        # handlers. If a build ever stops emitting them the console answers 404
        # on sign-in while `/login` itself still renders, so checking the page
        # alone would not notice. Assert the compiled manifest, before the
        # release is packaged.
        run: |
          manifest=apps/admin/.next/server/app-paths-manifest.json
          test -f "$manifest"
          for route in login refresh logout me; do
            jq -e --arg key "/api/v1/admin/auth/$route/route" \
              'has($key)' "$manifest" > /dev/null \
              || { echo "Admin BFF route missing from build: $route"; exit 1; }
          done

      - name: Confirm generated and build output is clean
        run: |
          git diff --check
          git diff --exit-code

      - name: Package exact-SHA release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        run: |
          chmod +x scripts/deployment/package-release.sh
          scripts/deployment/package-release.sh \
            "${RELEASE_SHA}" \
            "${RUNNER_TEMP}/universta-release"

      - name: Upload exact-SHA release for deployment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: universta-release-${{ env.RELEASE_SHA }}
          path: |
            ${{ runner.temp }}/universta-release/universta-${{ env.RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/universta-release/universta-${{ env.RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  api-tests:
    # The API's own suites, which need a migrated and seeded database. Split
    # from the checks above so a lint error does not first wait for MySQL,
    # and so the two run side by side.
    name: CI / API tests
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci
      SHADOW_DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci_shadow
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SWAGGER_ENABLED: false
      JWT_ACCESS_SECRET: ci-only-access-secret-2026-long-enough-for-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-2026-different-and-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      AUTH_REFRESH_COOKIE_NAME: universta_admin_refresh
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 15
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-only-seed-password-2026-strong
      SEED_DEMO_CATALOG: "true"
      SUPER_ADMIN_FIRST_NAME: CI
      SUPER_ADMIN_LAST_NAME: Admin
      CI_DB_PASSWORD: ci-only-db-password-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node, dependencies and a seeded database
        uses: ./.github/actions/ci-setup
        with:
          ci-db-password: ${{ env.CI_DB_PASSWORD }}

      - name: API unit tests
        run: npm --workspace apps/api run test -- --runInBand

      - name: API foundation, auth and catalog E2E tests
        run: npm --workspace apps/api run test:e2e -- --runInBand

  browser-e2e:
    # The browser suite was 582 of the pipeline's 960 seconds, run by a single
    # Playwright worker because its specs share one database and clean up by a
    # run marker -- two workers in one run would tread on each other.
    #
    # Sharding across jobs sidesteps that rather than loosening it: each shard
    # is a runner of its own, with its own MySQL and its own seed, so the
    # isolation `workers: 1` is protecting is free here. The config is
    # untouched.
    #
    # It also splits the two Next production builds Playwright's webServer does
    # on the way in, which were part of that 582s and not of the tests at all.
    name: CI / Admin browser E2E ${{ matrix.shard }}/3
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci
      SHADOW_DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci_shadow
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SWAGGER_ENABLED: false
      JWT_ACCESS_SECRET: ci-only-access-secret-2026-long-enough-for-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-2026-different-and-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      AUTH_REFRESH_COOKIE_NAME: universta_admin_refresh
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 15
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-only-seed-password-2026-strong
      SEED_DEMO_CATALOG: "true"
      SUPER_ADMIN_FIRST_NAME: CI
      SUPER_ADMIN_LAST_NAME: Admin
      CI_DB_PASSWORD: ci-only-db-password-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node, dependencies, a seeded database and Chromium
        uses: ./.github/actions/ci-setup
        with:
          ci-db-password: ${{ env.CI_DB_PASSWORD }}
          playwright: 'true'

      - name: Admin browser E2E tests
        run: npm --workspace apps/admin run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-failures-shard-${{ matrix.shard }}
          path: |
            apps/admin/test-results/
            apps/admin/playwright-report/
          if-no-files-found: ignore

  deploy-demo:
    name: Deploy / AWS demo
    needs: [checks, api-tests, browser-e2e]
    if: >-
      needs.checks.result == 'success' &&
      needs.api-tests.result == 'success' &&
      needs.browser-e2e.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: demo
      url: http://54.162.49.131
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::771413672221:role/universta-demo-github-deploy-role
      AWS_ARTIFACT_BUCKET: universta-demo-artifacts-771413672221-us-east-1
      AWS_INSTANCE_ID: i-0288a3283c26638b3
      # HTTPS, and the certificate's own names -- the bare IP is not on the
      # certificate, and http:// now answers with a 301 whose body is not JSON,
      # which the health check below feeds to jq.
      DEPLOY_WEB_URL: https://54.162.49.131.nip.io
      DEPLOY_ADMIN_URL: https://admin.54.162.49.131.nip.io
      DEPLOY_API_URL: https://api.54.162.49.131.nip.io

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download exact-SHA release
        uses: actions/download-artifact@v8.0.1
        with:
          name: universta-release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/universta-release

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: universta-${{ github.run_id }}

      - name: Publish immutable exact-SHA artifact
        run: |
          archive="${RUNNER_TEMP}/universta-release/universta-${RELEASE_SHA}.tar.gz"
          checksum="${archive}.sha256"

          if aws s3api head-object \
            --bucket "${AWS_ARTIFACT_BUCKET}" \
            --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz" \
            >/dev/null 2>&1; then
            aws s3api head-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz.sha256" \
              >/dev/null
            echo "Reusing the existing immutable artifact for ${RELEASE_SHA}."
          else
            aws s3api put-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz" \
              --body "${archive}" \
              --server-side-encryption AES256 \
              --tagging immutable=true \
              >/dev/null
            aws s3api put-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz.sha256" \
              --body "${checksum}" \
              --server-side-encryption AES256 \
              --tagging immutable=true \
              >/dev/null
          fi

      - name: Deploy exact SHA through SSM
        run: |
          chmod +x scripts/deployment/invoke-ssm.sh
          scripts/deployment/invoke-ssm.sh \
            deploy \
            "${RELEASE_SHA}" \
            "${AWS_ARTIFACT_BUCKET}" \
            "${AWS_INSTANCE_ID}" \
            "${AWS_REGION}"

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --max-time 30 "${DEPLOY_API_URL}/health" |
            jq -e '.status == "ok" and .database == "up"'
          # --location, because /countries is now a permanent redirect to the
          # Study Abroad directory: without it curl reports the 308 as a pass
          # and never checks that anything renders at the other end.
          for path in / /study-abroad /countries /subjects /courses /counselling; do
            curl --fail --location --silent --show-error --max-time 30 \
              --output /dev/null "${DEPLOY_WEB_URL}${path}"
          done
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null "${DEPLOY_ADMIN_URL}/login"

      - name: Verify the Admin sign-in path answers end to end
        # `/login` rendering only proves the page is served. This drives the
        # whole chain -- Admin host, Next BFF, API, database, AuthService --
        # and requires no credential: the account is in the reserved .invalid
        # TLD, so it cannot exist and cannot lock a real administrator out. A
        # verdict of INVALID_CREDENTIALS is the pass; 404, 502 or 500 are the
        # failures this exists to catch.
        run: |
          set -euo pipefail

          expect_code() {
            local path="$1" expected="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 \
              --output "${body}" --write-out '%{http_code}' \
              -X POST "${DEPLOY_ADMIN_URL}${path}" \
              -H 'content-type: application/json' \
              -H 'x-universta-admin-client: web' \
              --data '{"email":"deploy-smoke@universta.invalid","password":"deploy-smoke-not-a-real-password"}')"
            if [ "${status}" != "401" ]; then
              echo "${path} answered HTTP ${status}, expected 401:"
              cat "${body}"
              exit 1
            fi
            jq -e --arg code "${expected}" '.error.code == $code' "${body}" > /dev/null \
              || { echo "${path} did not report ${expected}:"; cat "${body}"; exit 1; }
          }

          expect_code /api/v1/admin/auth/login INVALID_CREDENTIALS
          expect_code /api/v1/admin/auth/refresh INVALID_REFRESH_TOKEN

      - name: Record deployment summary
        run: |
          {
            echo "### Universta AWS demo deployment"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Web: ${DEPLOY_WEB_URL}"
            echo "- Admin: ${DEPLOY_ADMIN_URL}"
            echo "- API: ${DEPLOY_API_URL}"
            echo "- Transport: HTTP fallback pending an owned Route 53 domain"
          } >> "${GITHUB_STEP_SUMMARY}"

  operate-demo:
    name: Deploy / AWS demo ${{ inputs.action }}
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::771413672221:role/universta-demo-github-deploy-role
      AWS_ARTIFACT_BUCKET: universta-demo-artifacts-771413672221-us-east-1
      AWS_INSTANCE_ID: i-0288a3283c26638b3
      # Deliberately present only for the manual QA seed operation. It is never
      # available to push/PR CI or automatic deployment.
      QA_FORGE_E2E_ADMIN_PASSWORD: ${{ inputs.action == 'qa-seed' && secrets.QA_FORGE_E2E_ADMIN_PASSWORD || '' }}
      QA_FORGE_E2E_STUDENT_PASSWORD: ${{ inputs.action == 'qa-seed' && secrets.QA_FORGE_E2E_STUDENT_PASSWORD || '' }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: universta-${{ github.run_id }}

      - name: Run deployment operation through SSM
        run: |
          chmod +x scripts/deployment/invoke-ssm.sh
          scripts/deployment/invoke-ssm.sh \
            "${{ inputs.action }}" \
            "${{ inputs.sha }}" \
            "${AWS_ARTIFACT_BUCKET}" \
            "${AWS_INSTANCE_ID}" \
            "${AWS_REGION}"
