name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
          - status
      sha:
        description: Exact 40-character commit SHA (required for deploy, optional for rollback)
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'universta-demo-deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}

jobs:
  foundation-ci:
    name: CI / Foundation and Admin Auth
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci
      SHADOW_DATABASE_URL: mysql://universta_ci_user:ci-only-db-password-2026@127.0.0.1:3306/universta_ci_shadow
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SWAGGER_ENABLED: false
      JWT_ACCESS_SECRET: ci-only-access-secret-2026-long-enough-for-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-2026-different-and-long
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      AUTH_REFRESH_COOKIE_NAME: universta_admin_refresh
      AUTH_MAX_FAILED_ATTEMPTS: 5
      AUTH_LOCK_MINUTES: 15
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-only-seed-password-2026-strong
      SEED_DEMO_CATALOG: "true"
      SUPER_ADMIN_FIRST_NAME: CI
      SUPER_ADMIN_LAST_NAME: Admin
      CI_DB_PASSWORD: ci-only-db-password-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js 25
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux CSS build binary
        run: |
          lightning_dir="${RUNNER_TEMP}/lightningcss-linux-x64-gnu"
          mkdir -p "$lightning_dir/extracted" node_modules/lightningcss-linux-x64-gnu
          npm pack --silent --pack-destination "$lightning_dir" lightningcss-linux-x64-gnu@1.32.0
          tar -xzf "$lightning_dir/lightningcss-linux-x64-gnu-1.32.0.tgz" -C "$lightning_dir/extracted"
          cp -R "$lightning_dir/extracted/package/." node_modules/lightningcss-linux-x64-gnu/

          oxide_dir="${RUNNER_TEMP}/tailwindcss-oxide-linux-x64-gnu"
          mkdir -p "$oxide_dir/extracted" apps/web/node_modules/@tailwindcss/oxide-linux-x64-gnu apps/admin/node_modules/@tailwindcss/oxide-linux-x64-gnu
          npm pack --silent --pack-destination "$oxide_dir" @tailwindcss/oxide-linux-x64-gnu@4.3.3
          tar -xzf "$oxide_dir/tailwindcss-oxide-linux-x64-gnu-4.3.3.tgz" -C "$oxide_dir/extracted"
          cp -R "$oxide_dir/extracted/package/." apps/web/node_modules/@tailwindcss/oxide-linux-x64-gnu/
          cp -R "$oxide_dir/extracted/package/." apps/admin/node_modules/@tailwindcss/oxide-linux-x64-gnu/

      - name: Start native MySQL
        run: sudo systemctl start mysql

      - name: Create CI-only databases and user
        run: |
          # Ubuntu's preinstalled runner MySQL root password is the documented CI-only value: root.
          sudo mysql --protocol=socket -uroot -proot -e "CREATE DATABASE IF NOT EXISTS universta_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS universta_ci_shadow CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'universta_ci_user'@'127.0.0.1' IDENTIFIED BY '${CI_DB_PASSWORD}'; GRANT ALL PRIVILEGES ON universta_ci.* TO 'universta_ci_user'@'127.0.0.1'; GRANT ALL PRIVILEGES ON universta_ci_shadow.* TO 'universta_ci_user'@'127.0.0.1'; FLUSH PRIVILEGES;"

      - name: Prisma format check
        run: npm run db:format -- --check

      - name: Prisma validate
        run: npm run db:validate

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npm run db:migrate:deploy

      - name: Foundation seed
        run: npm run db:seed

      - name: Demo catalog seed
        run: npm --workspace apps/api run db:seed:demo

      - name: API unit tests
        run: npm --workspace apps/api run test -- --runInBand

      - name: API foundation, auth and catalog E2E tests
        run: npm --workspace apps/api run test:e2e -- --runInBand

      - name: Admin unit and catalog tests
        run: npm --workspace apps/admin run test -- --run

      - name: Web unit tests
        run: npm --workspace apps/web run test -- --run

      - name: Install Playwright Chromium
        run: npm --workspace apps/admin exec -- playwright install --with-deps chromium

      - name: Admin browser E2E tests
        run: npm --workspace apps/admin run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-failures
          path: |
            apps/admin/test-results/
            apps/admin/playwright-report/
          if-no-files-found: ignore

      - name: Lint
        run: npm run lint

      - name: Build web, admin, and API
        run: npm run build

      - name: Confirm generated and build output is clean
        run: |
          git diff --check
          git diff --exit-code

      - name: Package exact-SHA release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        run: |
          chmod +x scripts/deployment/package-release.sh
          scripts/deployment/package-release.sh \
            "${RELEASE_SHA}" \
            "${RUNNER_TEMP}/universta-release"

      - name: Upload exact-SHA release for deployment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: universta-release-${{ env.RELEASE_SHA }}
          path: |
            ${{ runner.temp }}/universta-release/universta-${{ env.RELEASE_SHA }}.tar.gz
            ${{ runner.temp }}/universta-release/universta-${{ env.RELEASE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  deploy-demo:
    name: Deploy / AWS demo
    needs: foundation-ci
    if: >-
      needs.foundation-ci.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: demo
      url: http://54.162.49.131
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::771413672221:role/universta-demo-github-deploy-role
      AWS_ARTIFACT_BUCKET: universta-demo-artifacts-771413672221-us-east-1
      AWS_INSTANCE_ID: i-0288a3283c26638b3
      DEPLOY_WEB_URL: http://54.162.49.131
      DEPLOY_ADMIN_URL: http://admin.54.162.49.131.nip.io
      DEPLOY_API_URL: http://api.54.162.49.131.nip.io

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download exact-SHA release
        uses: actions/download-artifact@v8.0.1
        with:
          name: universta-release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/universta-release

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: universta-${{ github.run_id }}

      - name: Publish immutable exact-SHA artifact
        run: |
          archive="${RUNNER_TEMP}/universta-release/universta-${RELEASE_SHA}.tar.gz"
          checksum="${archive}.sha256"

          if aws s3api head-object \
            --bucket "${AWS_ARTIFACT_BUCKET}" \
            --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz" \
            >/dev/null 2>&1; then
            aws s3api head-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz.sha256" \
              >/dev/null
            echo "Reusing the existing immutable artifact for ${RELEASE_SHA}."
          else
            aws s3api put-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz" \
              --body "${archive}" \
              --server-side-encryption AES256 \
              --tagging immutable=true \
              >/dev/null
            aws s3api put-object \
              --bucket "${AWS_ARTIFACT_BUCKET}" \
              --key "releases/${RELEASE_SHA}/universta-${RELEASE_SHA}.tar.gz.sha256" \
              --body "${checksum}" \
              --server-side-encryption AES256 \
              --tagging immutable=true \
              >/dev/null
          fi

      - name: Deploy exact SHA through SSM
        run: |
          chmod +x scripts/deployment/invoke-ssm.sh
          scripts/deployment/invoke-ssm.sh \
            deploy \
            "${RELEASE_SHA}" \
            "${AWS_ARTIFACT_BUCKET}" \
            "${AWS_INSTANCE_ID}" \
            "${AWS_REGION}"

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --max-time 30 "${DEPLOY_API_URL}/health" |
            jq -e '.status == "ok" and .database == "up"'
          for path in / /countries /subjects /courses /counselling; do
            curl --fail --silent --show-error --max-time 30 \
              --output /dev/null "${DEPLOY_WEB_URL}${path}"
          done
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null "${DEPLOY_ADMIN_URL}/login"

      - name: Record deployment summary
        run: |
          {
            echo "### Universta AWS demo deployment"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Web: ${DEPLOY_WEB_URL}"
            echo "- Admin: ${DEPLOY_ADMIN_URL}"
            echo "- API: ${DEPLOY_API_URL}"
            echo "- Transport: HTTP fallback pending an owned Route 53 domain"
          } >> "${GITHUB_STEP_SUMMARY}"

  operate-demo:
    name: Deploy / AWS demo ${{ inputs.action }}
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::771413672221:role/universta-demo-github-deploy-role
      AWS_ARTIFACT_BUCKET: universta-demo-artifacts-771413672221-us-east-1
      AWS_INSTANCE_ID: i-0288a3283c26638b3

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: universta-${{ github.run_id }}

      - name: Run deployment operation through SSM
        run: |
          chmod +x scripts/deployment/invoke-ssm.sh
          scripts/deployment/invoke-ssm.sh \
            "${{ inputs.action }}" \
            "${{ inputs.sha }}" \
            "${AWS_ARTIFACT_BUCKET}" \
            "${AWS_INSTANCE_ID}" \
            "${AWS_REGION}"
