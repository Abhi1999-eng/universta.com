name: Patch course workspace admin UX

on:
  push:
    branches:
      - fix/course-workspace-admin-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-workspace-admin-ux
          fetch-depth: 0
      - name: Patch course workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/admin/src/features/catalog/CourseEditorialWorkspace.tsx')
          text = path.read_text()

          # Human-readable helpers and reusable blank section state.
          anchor = "const blankMapping: MappingDraft = { countryId: '', availabilityStatus: 'AVAILABLE', status: 'ACTIVE', indicativeTuitionMin: '', indicativeTuitionMax: '', currencyCode: '', tuitionPeriod: 'PER_YEAR', applicationFeeMin: '', applicationFeeMax: '', durationMinOverride: '', durationMaxOverride: '', durationUnitOverride: '', academicMinPercentage: '', academicMinCgpa: '', ieltsMinScore: '', pteMinScore: '', toeflMinScore: '', duolingoMinScore: '', workExperienceMonths: '', scholarshipAvailable: false, admissionRequirements: '', englishRequirements: '', applicationNotes: '', careerOpportunities: '', sourceReference: '', verifiedAt: '', isFeatured: false, displayOrder: '0' };\n"
          assert anchor in text
          helpers = anchor + """

type SectionDraft = { sectionKey: string; sectionType: string; heading: string; subheading: string; bodyJson: string; mediaId: string; status: string; displayOrder: string };
const blankSection: SectionDraft = { sectionKey: 'curriculum', sectionType: 'RICH_TEXT', heading: '', subheading: '', bodyJson: '', mediaId: '', status: 'ACTIVE', displayOrder: '0' };

function readableCatalogError(cause: unknown, fallback: string): string {
  const typed = cause as Partial<CatalogMutationError>;
  if (typed.code === 'VALIDATION_ERROR' && Array.isArray(typed.details)) {
    const details = typed.details
      .map((item) => {
        if (!item || typeof item !== 'object') return '';
        const row = item as { property?: unknown; message?: unknown };
        if (typeof row.message !== 'string') return '';
        const field = typeof row.property === 'string' ? row.property : 'Field';
        return `${field}: ${row.message}`;
      })
      .filter(Boolean);
    if (details.length) return details.join(' · ');
  }
  return typed.message ?? (cause instanceof Error ? cause.message : fallback);
}

function sectionBodyText(body: Record<string, unknown> | null): string {
  if (!body) return '';
  if (Array.isArray(body.paragraphs)) {
    return body.paragraphs.filter((item): item is string => typeof item === 'string').join('\n\n');
  }
  const values: string[] = [];
  const collect = (value: unknown) => {
    if (typeof value === 'string' || typeof value === 'number') values.push(String(value));
    else if (Array.isArray(value)) value.forEach(collect);
    else if (value && typeof value === 'object') Object.values(value as Record<string, unknown>).forEach(collect);
  };
  collect(body);
  return values.join('\n');
}

function sectionBodyPayload(body: string, sectionType: string): Record<string, unknown> {
  const text = body.trim();
  const lines = text.split(/\n+/).map((item) => item.trim()).filter(Boolean);
  if (sectionType === 'CHECKLIST') return { items: lines };
  if (sectionType === 'STEPS') return { steps: lines.map((item, index) => ({ order: index + 1, text: item })) };
  if (sectionType === 'FACT_GRID' || sectionType === 'CARD_GRID') return { items: lines.map((item) => ({ text: item })) };
  if (sectionType === 'CTA') return { text };
  if (sectionType === 'MEDIA') return { caption: text };
  return { paragraphs: lines };
}
"""
          text = text.replace(anchor, helpers, 1)

          old_state = "const [editSection, setEditSection] = useState<CourseSectionRecord | null>(null); const [section, setSection] = useState({ sectionKey: 'curriculum', sectionType: 'RICH_TEXT', heading: '', subheading: '', bodyJson: '{\\n  \"paragraphs\": []\\n}', mediaId: '', status: 'ACTIVE', displayOrder: '0' });"
          new_state = "const [editSection, setEditSection] = useState<CourseSectionRecord | null>(null); const [section, setSection] = useState<SectionDraft>({ ...blankSection });"
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          # Make workspace loading resilient: one optional panel cannot blank every other tab.
          load_pattern = re.compile(r"  const load = useCallback\(\(\) => \{.*?\}, \[courseId\]\);", re.S)
          load_match = load_pattern.search(text)
          assert load_match
          new_load = """  const load = useCallback(() => {
    setLoading(true);
    setError('');
    void Promise.allSettled([
      listCourseMappings(courseId),
      listCourseSections(courseId),
      listCourseFaqs(courseId),
      listCourseRelated(courseId),
      getCourseSeo(courseId),
      listCountries({ status: 'PUBLISHED', limit: 100 }),
      listIntakeOptions(),
      listAdminCourses({ limit: 100 }),
    ])
      .then((results) => {
        const [mapResult, sectionResult, faqResult, relatedResult, seoResult, countriesResult, intakeResult, courseResult] = results;
        if (mapResult.status === 'fulfilled') setMappings(mapResult.value.data);
        if (sectionResult.status === 'fulfilled') setSections(sectionResult.value.data);
        if (faqResult.status === 'fulfilled') setFaqs(faqResult.value.data);
        if (relatedResult.status === 'fulfilled') {
          setRelated(relatedResult.value.data);
          setRelatedIds(relatedResult.value.data.map((item) => item.relatedCourse.id));
        }
        if (seoResult.status === 'fulfilled') setSeoState(seoResult.value.data);
        if (countriesResult.status === 'fulfilled') setCountries(countriesResult.value.data);
        if (intakeResult.status === 'fulfilled') setIntakes(intakeResult.value.data);
        if (courseResult.status === 'fulfilled') setAllCourses(courseResult.value.data);
        const failed = results.find((result) => result.status === 'rejected');
        if (failed?.status === 'rejected') {
          setError(readableCatalogError(failed.reason, 'Unable to load part of the course workspace'));
        }
      })
      .finally(() => setLoading(false));
  }, [courseId]);"""
          text = text[:load_match.start()] + new_load + text[load_match.end():]

          # Client-side mapping validation with useful focus instead of a generic API banner.
          mapping_pattern = re.compile(r"  async function saveMapping\(event: React\.FormEvent\) \{.*?\n  async function saveIntakes", re.S)
          mapping_match = mapping_pattern.search(text)
          assert mapping_match
          new_mapping = """  async function saveMapping(event: React.FormEvent) {
    event.preventDefault();
    setError('');
    const focus = (id: string, message: string) => {
      setError(message);
      window.setTimeout(() => document.getElementById(id)?.focus(), 0);
    };
    if (!mapping.countryId) return focus('mapping-countryId', 'Choose a published country before adding the mapping.');
    if (mapping.durationUnitOverride && !['MONTHS', 'YEARS'].includes(mapping.durationUnitOverride)) {
      return focus('mapping-durationUnitOverride', 'Duration unit must be Months or Years.');
    }
    const needsVerification = mapping.availabilityStatus !== 'UNAVAILABLE';
    if (needsVerification && !mapping.sourceReference.trim()) {
      return focus('mapping-sourceReference', 'Official HTTPS source is required for Available or Limited mappings.');
    }
    if (mapping.sourceReference && !/^https:\/\//i.test(mapping.sourceReference.trim())) {
      return focus('mapping-sourceReference', 'Official source must start with https://');
    }
    if (needsVerification && !mapping.verifiedAt) {
      return focus('mapping-verifiedAt', 'Verified date is required for Available or Limited mappings.');
    }
    if (mapping.verifiedAt && new Date(mapping.verifiedAt) > new Date()) {
      return focus('mapping-verifiedAt', 'Verified date cannot be in the future.');
    }
    try {
      const result = editMapping
        ? await updateCourseMapping(courseId, editMapping.id, { ...payload(mapping), expectedUpdatedAt: editMapping.updatedAt })
        : await createCourseMapping(courseId, payload(mapping));
      setMappings((rows) => editMapping ? rows.map((row) => row.id === result.data.id ? result.data : row) : [...rows, result.data]);
      setEditMapping(null);
      setMapping({ ...blankMapping });
      setError('');
    } catch (cause: unknown) {
      setError(readableCatalogError(cause, 'Unable to save mapping'));
      window.setTimeout(() => document.getElementById('course-workspace-error')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 0);
    }
  }
  async function saveIntakes"""
          text = text[:mapping_match.start()] + new_mapping + text[mapping_match.end():]

          # Human text editor for content sections, plus omission of blank optional UUIDs.
          section_pattern = re.compile(r"  async function saveSection\(event: React\.FormEvent\) \{.*?\n  async function saveFaq", re.S)
          section_match = section_pattern.search(text)
          assert section_match
          new_section = """  async function saveSection(event: React.FormEvent) {
    event.preventDefault();
    setError('');
    if (!section.heading.trim()) {
      setError('Heading is required.');
      window.setTimeout(() => document.getElementById('section-heading')?.focus(), 0);
      return;
    }
    if (!section.bodyJson.trim()) {
      setError('Body content is required.');
      window.setTimeout(() => document.getElementById('section-body-content')?.focus(), 0);
      return;
    }
    const data = {
      sectionKey: section.sectionKey,
      sectionType: section.sectionType,
      heading: section.heading.trim(),
      ...(section.subheading.trim() ? { subheading: section.subheading.trim() } : {}),
      bodyJson: sectionBodyPayload(section.bodyJson, section.sectionType),
      ...(section.mediaId ? { mediaId: section.mediaId } : {}),
      status: section.status,
      displayOrder: Number(section.displayOrder) || 0,
    };
    try {
      const result = editSection
        ? await updateCourseSection(courseId, editSection.id, { ...data, expectedUpdatedAt: editSection.updatedAt })
        : await createCourseSection(courseId, data);
      setSections((rows) => editSection ? rows.map((row) => row.id === result.data.id ? result.data : row) : [...rows, result.data]);
      setEditSection(null);
      setSection({ ...blankSection });
      setError('');
    } catch (cause: unknown) {
      setError(readableCatalogError(cause, 'Unable to save content section'));
      window.setTimeout(() => document.getElementById('course-workspace-error')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 0);
    }
  }
  async function saveFaq"""
          text = text[:section_match.start()] + new_section + text[section_match.end():]

          # Keep tab errors local in feel and make old structured section data readable when editing.
          text = text.replace("{error ? <CatalogError message={error} onRetry={load} /> : null}", "{error ? <div id=\"course-workspace-error\"><CatalogError message={error} onRetry={load} /></div> : null}", 1)
          text = text.replace("onClick={() => setTab(value)}", "onClick={() => { setError(''); setTab(value); }}", 1)
          old_edit = "bodyJson: JSON.stringify(row.bodyJson ?? {}, null, 2), mediaId: row.media?.id ?? '', status: row.status, displayOrder: String(row.displayOrder)"
          new_edit = "bodyJson: sectionBodyText(row.bodyJson), mediaId: row.media?.id ?? '', status: row.status, displayOrder: String(row.displayOrder)"
          assert old_edit in text
          text = text.replace(old_edit, new_edit, 1)

          # Replace free-text enum/date/source controls in Availability with safe controls.
          old_mapping_fields = "{field('durationMinOverride', 'Duration min', 'course-mappings.durationMinOverride')}{field('durationMaxOverride', 'Duration max', 'course-mappings.durationMaxOverride')}{field('durationUnitOverride', 'Duration unit', 'course-mappings.durationUnitOverride')}{field('sourceReference', 'Official HTTPS source', 'course-mappings.sourceReference')}{field('verifiedAt', 'Verified date', 'course-mappings.verifiedAt')}"
          new_mapping_fields = """{field('durationMinOverride', 'Duration min', 'course-mappings.durationMinOverride')}{field('durationMaxOverride', 'Duration max', 'course-mappings.durationMaxOverride')}<div className=\"text-sm font-semibold\"><FieldLabel label=\"Duration unit\" htmlFor=\"mapping-durationUnitOverride\" helpKey=\"course-mappings.durationUnitOverride\" /><select id=\"mapping-durationUnitOverride\" className=\"mt-2 w-full rounded-lg border border-[#D9E0EA] px-3 py-2 font-normal\" value={mapping.durationUnitOverride} onChange={(event) => setMapping({ ...mapping, durationUnitOverride: event.target.value })}><option value=\"\">Use course duration unit</option><option value=\"MONTHS\">Months</option><option value=\"YEARS\">Years</option></select></div><div className=\"text-sm font-semibold\"><FieldLabel label=\"Official HTTPS source\" htmlFor=\"mapping-sourceReference\" helpKey=\"course-mappings.sourceReference\" /><input id=\"mapping-sourceReference\" type=\"url\" required={mapping.availabilityStatus !== 'UNAVAILABLE'} placeholder=\"https://official-source.example/...\" className=\"mt-2 w-full rounded-lg border border-[#D9E0EA] px-3 py-2 font-normal\" value={mapping.sourceReference} onChange={(event) => setMapping({ ...mapping, sourceReference: event.target.value })} /></div><div className=\"text-sm font-semibold\"><FieldLabel label=\"Verified date\" htmlFor=\"mapping-verifiedAt\" helpKey=\"course-mappings.verifiedAt\" /><input id=\"mapping-verifiedAt\" type=\"date\" required={mapping.availabilityStatus !== 'UNAVAILABLE'} max={new Date().toISOString().slice(0, 10)} className=\"mt-2 w-full rounded-lg border border-[#D9E0EA] px-3 py-2 font-normal\" value={mapping.verifiedAt} onChange={(event) => setMapping({ ...mapping, verifiedAt: event.target.value })} /></div>"""
          assert old_mapping_fields in text
          text = text.replace(old_mapping_fields, new_mapping_fields, 1)

          old_tuition = "{field('indicativeTuitionMin', 'Tuition min', 'course-mappings.indicativeTuitionMin')}{field('indicativeTuitionMax', 'Tuition max', 'course-mappings.indicativeTuitionMax')}{field('currencyCode', 'Currency (ISO 4217)', 'course-mappings.currencyCode')}{field('tuitionPeriod', 'Tuition period', 'course-mappings.tuitionPeriod')}"
          new_tuition = """{field('indicativeTuitionMin', 'Tuition min', 'course-mappings.indicativeTuitionMin')}{field('indicativeTuitionMax', 'Tuition max', 'course-mappings.indicativeTuitionMax')}{field('currencyCode', 'Currency (ISO 4217)', 'course-mappings.currencyCode')}<div className=\"text-sm font-semibold\"><FieldLabel label=\"Tuition period\" htmlFor=\"mapping-tuitionPeriod\" helpKey=\"course-mappings.tuitionPeriod\" /><select id=\"mapping-tuitionPeriod\" className=\"mt-2 w-full rounded-lg border border-[#D9E0EA] px-3 py-2 font-normal\" value={mapping.tuitionPeriod} onChange={(event) => setMapping({ ...mapping, tuitionPeriod: event.target.value })}><option value=\"PER_YEAR\">Per year</option><option value=\"PER_SEMESTER\">Per semester</option><option value=\"PER_MONTH\">Per month</option><option value=\"TOTAL\">Total</option></select></div>"""
          assert old_tuition in text
          text = text.replace(old_tuition, new_tuition, 1)

          # Expose mapping display order before checkboxes and make submit explicit.
          checkbox_anchor = "<div className=\"mt-4 flex flex-wrap gap-5 text-sm font-semibold\"><div><input id=\"mapping-scholarshipAvailable\""
          assert checkbox_anchor in text
          text = text.replace(checkbox_anchor, "<div className=\"mt-4 max-w-xs\">" + "{field('displayOrder', 'Display order', 'course-mappings.displayOrder')}" + "</div>" + checkbox_anchor, 1)
          text = text.replace("<button className=\"rounded-lg bg-[#1657CF] px-4 py-2 text-sm font-semibold text-white\">{editMapping ? 'Update mapping' : 'Add mapping'}</button>", "<button type=\"submit\" className=\"rounded-lg bg-[#1657CF] px-4 py-2 text-sm font-semibold text-white\">{editMapping ? 'Update mapping' : 'Add mapping'}</button>", 1)

          # Turn Structured body JSON into a normal content field; expose section status and make Reset real.
          old_body = "<div className=\"mt-4 block text-sm font-semibold\"><FieldLabel label=\"Structured body JSON\" htmlFor=\"section-body-json\" required helpKey=\"course-sections.bodyJson\" /><textarea id=\"section-body-json\" required className=\"mt-2 min-h-40 w-full rounded-lg border px-3 py-2 font-mono text-xs font-normal\" value={section.bodyJson} onChange={(event) => setSection({ ...section, bodyJson: event.target.value })} /></div>"
          new_body = """<div className=\"mt-4 block text-sm font-semibold\"><FieldLabel label=\"Body content\" htmlFor=\"section-body-content\" required helpKey=\"course-sections.bodyJson\" /><textarea id=\"section-body-content\" required className=\"mt-2 min-h-40 w-full rounded-lg border border-[#D9E0EA] px-3 py-3 font-normal leading-6\" value={section.bodyJson} onChange={(event) => setSection({ ...section, bodyJson: event.target.value })} placeholder=\"Write the content normally. Use a new line for a new paragraph or list item.\" /><p className=\"mt-2 text-xs font-normal text-[#667085]\">No JSON needed. The system stores the structured format automatically based on Section type.</p></div>"""
          assert old_body in text
          text = text.replace(old_body, new_body, 1)

          media_anchor = "<MediaPickerDialog label=\"Existing media\" value={section.mediaId} media={media} onChange={(value) => setSection({ ...section, mediaId: value })} />"
          assert media_anchor in text
          text = text.replace(media_anchor, media_anchor + "<div className=\"text-sm font-semibold\"><FieldLabel label=\"Status\" htmlFor=\"section-status\" help={commonFieldHelp.status} /><select id=\"section-status\" className=\"mt-2 w-full rounded-lg border px-3 py-2 font-normal\" value={section.status} onChange={(event) => setSection({ ...section, status: event.target.value })}><option value=\"ACTIVE\">Active</option><option value=\"INACTIVE\">Inactive</option></select></div>", 1)
          text = text.replace("onClick={() => { setEditSection(null); }} className=\"rounded-lg border px-4 py-2 text-sm font-semibold\">Reset</button><button className=\"rounded-lg bg-[#1657CF] px-4 py-2 text-sm font-semibold text-white\">{editSection ? 'Update section' : 'Add section'}</button>", "onClick={() => { setEditSection(null); setSection({ ...blankSection }); }} className=\"rounded-lg border px-4 py-2 text-sm font-semibold\">Reset</button><button type=\"submit\" className=\"rounded-lg bg-[#1657CF] px-4 py-2 text-sm font-semibold text-white\">{editSection ? 'Update section' : 'Add section'}</button>", 1)

          path.write_text(text)
          Path('.github/workflows/patch-course-workspace-admin-ux.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/features/catalog/CourseEditorialWorkspace.tsx .github/workflows/patch-course-workspace-admin-ux.yml
          git commit -m "fix(admin): make course workspace forms usable"
          git push origin HEAD:fix/course-workspace-admin-ux
