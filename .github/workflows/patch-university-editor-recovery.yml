name: Patch university editor recovery

on:
  push:
    branches:
      - fix/university-editor-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/university-editor-recovery
          fetch-depth: 0
      - name: Apply university editor fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # API: expanded detail responses can contain MediaAsset BigInt values
          # through SEO relations. Convert that one non-JSON-safe field before
          # the response reaches Nest's JSON serializer.
          api_path = Path('apps/api/src/expanded/expanded.service.ts')
          api = api_path.read_text()
          api = replace_once(
              api,
              """    const seo = await this.prisma.seoMetadata.findUnique({\n      where: {\n        ownerType_ownerId: { ownerType: resource, ownerId: String(record.id) },\n      },\n      include: { ogMedia: true, twitterMedia: true },\n    });\n    return { ...record, seo };\n""",
              """    const seo = await this.prisma.seoMetadata.findUnique({\n      where: {\n        ownerType_ownerId: { ownerType: resource, ownerId: String(record.id) },\n      },\n      include: { ogMedia: true, twitterMedia: true },\n    });\n    // MediaAsset.fileSizeBytes is a Prisma BigInt. JSON.stringify cannot\n    // serialize BigInt, so an expanded record with SEO OG/Twitter media used\n    // to turn an otherwise-valid admin detail request into a raw HTTP 500.\n    // The upload cap keeps this value safely inside Number's integer range.\n    const jsonSafeMedia = (media: any) =>\n      media && typeof media.fileSizeBytes === 'bigint'\n        ? { ...media, fileSizeBytes: Number(media.fileSizeBytes) }\n        : media;\n    return {\n      ...record,\n      seo: seo\n        ? {\n            ...seo,\n            ogMedia: jsonSafeMedia(seo.ogMedia),\n            twitterMedia: jsonSafeMedia(seo.twitterMedia),\n          }\n        : null,\n    };\n""",
              'serialize SEO media',
          )
          api = replace_once(
              api,
              """        'featuredMediaId',\n        'sourceReference',\n        'status',\n""",
              """        'featuredMediaId',\n        'sourceReference',\n        'verifiedAt',\n        'status',\n""",
              'allow University verifiedAt',
          )
          api = replace_once(
              api,
              """    if (resource === 'scholarships') {\n      normalizeDecimal('amount');\n      normalizeDate('deadline');\n    }\n""",
              """    if (resource === 'scholarships') {\n      normalizeDecimal('amount');\n      normalizeDate('deadline');\n    }\n    if (resource === 'universities') normalizeDate('verifiedAt');\n""",
              'normalize University verifiedAt',
          )
          api_path.write_text(api)

          editor_path = Path('apps/admin/src/features/phase1/Phase1StructuredEditor.tsx')
          editor = editor_path.read_text()
          editor = replace_once(
              editor,
              """const inputClass =\n  \"mt-1 w-full rounded-xl border border-[#D9E0EA] bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-[#1657CF] focus:ring-2 focus:ring-[#DCE8FF]\";\n""",
              """const inputClass =\n  \"mt-1 w-full rounded-xl border border-[#D9E0EA] bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-[#1657CF] focus:ring-2 focus:ring-[#DCE8FF]\";\nconst invalidInputClass =\n  \"mt-1 w-full rounded-xl border border-[#F04438] bg-white px-3 py-2.5 text-sm font-normal outline-none focus:border-[#F04438] focus:ring-2 focus:ring-[#FEE4E2]\";\n""",
              'invalid input class',
          )
          editor = replace_once(
              editor,
              """  const [errors, setErrors] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState(\"\");\n  // New records also depend on asynchronous relationship options; do not let a\n""",
              """  const [errors, setErrors] = useState<Record<string, string>>({});\n  const [message, setMessage] = useState(\"\");\n  const [messageTone, setMessageTone] = useState<\"success\" | \"error\">(\"success\");\n  const [loadError, setLoadError] = useState(false);\n  const [reloadKey, setReloadKey] = useState(0);\n  // New records also depend on asynchronous relationship options; do not let a\n""",
              'message/load states',
          )
          editor = replace_once(
              editor,
              """      \"featuredMediaId\",\n      \"sourceReference\",\n      \"status\",\n""",
              """      \"featuredMediaId\",\n      \"sourceReference\",\n      \"verifiedAt\",\n      \"status\",\n""",
              'hydrate verifiedAt',
          )
          editor = replace_once(
              editor,
              """    next.deadline = next.deadline ? next.deadline.slice(0, 10) : \"\";\n    next.publishedDate = next.publishedDate\n""",
              """    next.deadline = next.deadline ? next.deadline.slice(0, 10) : \"\";\n    next.verifiedAt = next.verifiedAt ? next.verifiedAt.slice(0, 10) : \"\";\n    next.publishedDate = next.publishedDate\n""",
              'format verifiedAt',
          )
          editor = replace_once(
              editor,
              """      .then(([nextOptions, record]) => {\n        if (!active) return;\n        setOptions(nextOptions);\n        if (record) hydrate(record);\n        setLoading(false);\n      })\n      .catch((error: unknown) => {\n        if (!active) return;\n        setMessage(\n          error instanceof Error ? error.message : \"Unable to load editor\",\n        );\n        setLoading(false);\n      });\n    return () => {\n      active = false;\n    };\n  }, [recordId, resource]);\n""",
              """      .then(([nextOptions, record]) => {\n        if (!active) return;\n        setOptions(nextOptions);\n        if (record) hydrate(record);\n        setLoadError(false);\n        setMessage(\"\");\n        setLoading(false);\n      })\n      .catch((error: unknown) => {\n        if (!active) return;\n        setMessageTone(\"error\");\n        setLoadError(true);\n        setMessage(\n          error instanceof Error ? error.message : \"Unable to load editor\",\n        );\n        setLoading(false);\n      });\n    return () => {\n      active = false;\n    };\n  }, [recordId, resource, reloadKey]);\n""",
              'safe editor load',
          )
          editor = replace_once(
              editor,
              """    if (resource === \"universities\" && !values.countryId)\n      next.countryId = \"Select a country.\";\n    if (resource === \"offerings\" && !values.courseLevelId)\n""",
              """    if (resource === \"universities\" && !values.countryId)\n      next.countryId = \"Select a country.\";\n    if (values.slug && !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(values.slug))\n      next.slug = \"Use lowercase letters, numbers and single hyphens only.\";\n    if (\n      !/^\\d+$/.test(values.displayOrder ?? \"\") ||\n      Number(values.displayOrder) < 0 ||\n      Number(values.displayOrder) > 999999\n    )\n      next.displayOrder = \"Display order must be a whole number from 0 to 999999.\";\n    if (resource === \"universities\") {\n      if (\n        values.sourceReference?.trim() &&\n        !/^https:\\/\\//i.test(values.sourceReference.trim())\n      )\n        next.sourceReference = \"Source URL must start with https://.\";\n      if (values.verifiedAt && new Date(values.verifiedAt) > new Date())\n        next.verifiedAt = \"Verified date cannot be in the future.\";\n    }\n    if (resource === \"offerings\" && !values.courseLevelId)\n""",
              'University validation',
          )
          editor = replace_once(
              editor,
              """    if (!validate() || busy || loading) return;\n    setBusy(true);\n    setMessage(\"\");\n""",
              """    if (!validate() || busy || loading || loadError) return;\n    setBusy(true);\n    setMessage(\"\");\n""",
              'block submit after load error',
          )
          editor = replace_once(
              editor,
              """      setMessage(recordId ? \"Record updated.\" : \"Draft created.\");\n      await onSaved();\n    } catch (error: unknown) {\n      setMessage(\n""",
              """      setMessageTone(\"success\");\n      setMessage(recordId ? \"Record updated.\" : \"Draft created.\");\n      await onSaved();\n    } catch (error: unknown) {\n      setMessageTone(\"error\");\n      setMessage(\n""",
              'save message tone',
          )
          editor = replace_once(
              editor,
              """      {message ? (\n        <p\n          role=\"status\"\n          className=\"rounded-xl bg-[#E9F8F0] px-4 py-3 text-sm text-[#18794E]\"\n        >\n          {message}\n        </p>\n      ) : null}\n      {loading ? <p role=\"status\" className=\"text-sm text-[#667085]\">Loading record…</p> : null}\n      <fieldset disabled={loading} className=\"contents\" aria-busy={loading}>\n""",
              """      {message ? (\n        <div\n          role={messageTone === \"error\" ? \"alert\" : \"status\"}\n          className={`flex flex-wrap items-center justify-between gap-3 rounded-xl border px-4 py-3 text-sm ${\n            messageTone === \"error\"\n              ? \"border-[#FECDCA] bg-[#FEF3F2] text-[#B42318]\"\n              : \"border-[#ABEFC6] bg-[#ECFDF3] text-[#067647]\"\n          }`}\n        >\n          <span>{message}</span>\n          {loadError ? (\n            <button\n              type=\"button\"\n              className=\"rounded-lg border border-[#F04438] px-3 py-1.5 font-semibold\"\n              onClick={() => {\n                setMessage(\"\");\n                setLoadError(false);\n                setLoading(true);\n                setReloadKey((value) => value + 1);\n              }}\n            >\n              Retry loading\n            </button>\n          ) : null}\n        </div>\n      ) : null}\n      {loading ? <p role=\"status\" className=\"text-sm text-[#667085]\">Loading record…</p> : null}\n      <fieldset\n        disabled={loading || loadError}\n        className=\"contents\"\n        aria-busy={loading}\n      >\n""",
              'danger/success banner',
          )
          editor = replace_once(
              editor,
              """          className={`${inputClass} min-h-28`}\n          aria-invalid={Boolean(error)}\n""",
              """          className={`${error ? invalidInputClass : inputClass} min-h-28`}\n          aria-invalid={Boolean(error)}\n          required={required}\n""",
              'textarea invalid style',
          )
          editor = replace_once(
              editor,
              """          className={inputClass}\n          aria-invalid={Boolean(error)}\n""",
              """          className={error ? invalidInputClass : inputClass}\n          aria-invalid={Boolean(error)}\n          required={required}\n""",
              'input invalid style',
          )
          editor = replace_once(
              editor,
              """        className={inputClass}\n        aria-invalid={Boolean(error)}\n""",
              """        className={error ? invalidInputClass : inputClass}\n        aria-invalid={Boolean(error)}\n        required={required}\n""",
              'select invalid style',
          )
          editor = replace_once(
              editor,
              """        error={errors[entity]}\n        helpKey={helpKey(entity)}\n      />\n""",
              """        error={errors[entity]}\n        helpKey={helpKey(entity)}\n        required\n      />\n""",
              'core entity required',
          )
          editor = replace_once(
              editor,
              """        error={errors.slug}\n        helpKey={helpKey(\"slug\")}\n      />\n""",
              """        error={errors.slug}\n        helpKey={helpKey(\"slug\")}\n        required\n      />\n""",
              'slug required',
          )
          editor = replace_once(
              editor,
              """        value={values.displayOrder ?? \"0\"}\n        onChange={(value) => set(\"displayOrder\", value)}\n        help={commonFieldHelp.displayOrder}\n      />\n""",
              """        value={values.displayOrder ?? \"0\"}\n        onChange={(value) => set(\"displayOrder\", value)}\n        error={errors.displayOrder}\n        help={commonFieldHelp.displayOrder}\n      />\n""",
              'display order error',
          )
          editor = replace_once(
              editor,
              """        error={p.errors.countryId}\n        helpKey=\"universities.countryId\"\n      />\n""",
              """        error={p.errors.countryId}\n        helpKey=\"universities.countryId\"\n        required\n      />\n""",
              'country required',
          )
          editor = replace_once(
              editor,
              """        <Field\n          label=\"Source URL\"\n          value={p.values.sourceReference ?? \"\"}\n          onChange={(value) => p.set(\"sourceReference\", value)}\n          helpKey=\"universities.sourceReference\"\n        />\n        <MediaPickerDialog\n""",
              """        <Field\n          label=\"Source URL\"\n          type=\"url\"\n          value={p.values.sourceReference ?? \"\"}\n          onChange={(value) => p.set(\"sourceReference\", value)}\n          error={p.errors.sourceReference}\n          helpKey=\"universities.sourceReference\"\n        />\n        <Field\n          label=\"Verified date\"\n          type=\"date\"\n          value={p.values.verifiedAt ?? \"\"}\n          onChange={(value) => p.set(\"verifiedAt\", value)}\n          error={p.errors.verifiedAt}\n          help={{\n            purpose: \"Records when the University information was last checked against the official source.\",\n            input: \"Choose the date the source was verified.\",\n            dataType: \"Date\",\n            required: \"Optional, but recommended whenever a Source URL is recorded.\",\n            example: \"2026-08-08\",\n            dependency: \"Use together with Source URL for auditable University facts.\",\n            frontendEffect: \"Supports freshness and trust signals where verification is shown.\",\n          }}\n        />\n        <MediaPickerDialog\n""",
              'University verification field',
          )
          editor_path.write_text(editor)

          # Regression test: any expanded detail with SEO media must be JSON-safe.
          spec = Path('apps/api/src/expanded/expanded.media-serialization.spec.ts')
          spec.write_text("""import { ExpandedService } from './expanded.service';\nimport type { PrismaService } from '../prisma/prisma.service';\nimport type { ExperimentsService } from '../experiments/experiments.service';\n\ndescribe('ExpandedService admin detail media serialization', () => {\n  it('keeps a University detail JSON-serializable when SEO media is attached', async () => {\n    const prisma = {\n      university: {\n        findFirst: async () => ({\n          id: 'university-1',\n          countryId: 'country-1',\n          name: 'Test University',\n          slug: 'test-university',\n          campuses: [],\n          accreditations: [],\n        }),\n      },\n      seoMetadata: {\n        findUnique: async () => ({\n          id: 'seo-1',\n          ownerType: 'universities',\n          ownerId: 'university-1',\n          seoTitle: 'Test University',\n          metaDescription: 'Test description',\n          ogMedia: { id: 'media-1', fileSizeBytes: 2048n },\n          twitterMedia: { id: 'media-2', fileSizeBytes: 4096n },\n        }),\n      },\n    } as unknown as PrismaService;\n    const service = new ExpandedService(\n      prisma,\n      {} as ExperimentsService,\n    );\n\n    const result = (await service.adminDetail(\n      'universities',\n      'university-1',\n    )) as any;\n\n    expect(result.seo.ogMedia.fileSizeBytes).toBe(2048);\n    expect(result.seo.twitterMedia.fileSizeBytes).toBe(4096);\n    expect(() => JSON.stringify(result)).not.toThrow();\n  });\n});\n""")
          PY

          rm -f .university-editor-patch-trigger .github/workflows/patch-university-editor-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): recover University editor from detail-load failures"
          git push origin HEAD:fix/university-editor-recovery
